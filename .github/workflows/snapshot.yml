name: Update schedule data

on:
  schedule:
    # каждые 30 минут; источник публикует новую неделю чт–сб, этого с запасом
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Snapshot schedule
        run: npm run snapshot

      - name: Commit data
        id: commit
        run: |
          git config user.name "kitis-bot"
          git config user.email "kitis-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "изменений нет"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: обновление расписания"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Telegram
        if: steps.commit.outputs.changed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SITE_URL: https://0x-dorothy.github.io/kitis-sched/
        run: npm run notify

      - name: Build static
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /kitis-sched
        run: npm run build:static

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
